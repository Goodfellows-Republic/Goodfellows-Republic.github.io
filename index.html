<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goodfellows Republic</title>
    <meta name="description" content="Learn about the Goodfellows Republic, our Constitution, values, and community." />
    <meta name="theme-color" content="#3e5524" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Goodfellows Republic" />
    <meta property="og:title" content="Goodfellows Republic" />
    <meta property="og:description" content="Forever Green, Forever Free. Explore our Constitution, values, and community." />
    <meta property="og:image" content="%SITE_URL%brand/flag-share.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="240" />
    <meta property="og:image:height" content="160" />
    <meta property="og:image:alt" content="The flag of the Goodfellows Republic" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Goodfellows Republic" />
    <meta name="twitter:description" content="Forever Green, Forever Free. Explore our Constitution, values, and community." />
    <meta name="twitter:image" content="%SITE_URL%brand/flag-share.png" />
    <script id="discord:component-embed" type="application/json">
      {
        "component": {
          "type": 17,
          "accent_color": 4085028,
          "components": [
            {
              "type": 9,
              "components": [
                {
                  "type": 10,
                  "content": "# Goodfellows Republic\nForever Green, Forever Free. Explore our Constitution, values, and community."
                }
              ],
              "accessory": {
                "type": 11,
                "media": { "url": "%SITE_URL%brand/flag-share.png" },
                "description": "Flag of the Goodfellows Republic"
              }
            },
            {
              "type": 1,
              "components": [
                { "type": 2, "style": 5, "label": "Constitution", "url": "%SITE_URL%constitution/" },
                { "type": 2, "style": 5, "label": "Join Discord", "url": "https://discord.gg/9TQ76stCZZ" },
                { "type": 2, "style": 5, "label": "GitHub", "url": "https://github.com/Goodfellows-Republic" }
              ]
            }
          ]
        }
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/flag.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
